name: Verify

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://meldstock:meldstock@localhost:5432/meldstock
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-not-used-at-runtime
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SKIP_ENV_VALIDATION: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Build application
        run: npm run build
